<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 760px;
            margin: 0 auto;
            font-size:16px;
            padding:1rem;
        }
        h1, h2 {
            text-align: center;
            margin-bottom: 1rem;
        }
        p{
            margin-bottom: 1rem;
            font-size:1.2rem
        }
        ul, ol {
            padding:1rem;
        }
        a {
            text-decoration:none;
        }
        nav {
          display:flex;
          gap:10px;
          align-items: center;
        }
        .btn{
            text-align: center;
            text-decoration: none;
            background-color: #041d38;
            color: #fff;
            border-radius: 5px;
            padding:0.5rem 1rem;
        }
        /* Styling the main table container */
        table {
          width: 100%;
          border-collapse: collapse; /* Prevents double borders */
          margin: 20px 0;
          font-family: sans-serif;
          min-width: 400px;
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        /* Styling table headers */
        th {
          background-color: #041d38; /* Clean teal theme */
          color: #ffffff;
          text-align: left;
          font-weight: bold;
          padding: 12px 15px;
        }
        
        /* Styling table data cells */
        td {
          padding: 12px 15px;
          border-bottom: 1px solid #dddddd; /* Subtly separates rows */
        }
        
        /* Zebra striping - background color for alternating rows */
        tbody tr:nth-child(even) {
          background-color: #f3f3f3;
        }
        
        /* Highlight the row when the user hovers over it */
        tbody tr:hover {
          background-color: #f1f1f1;
        }
    </style>
    <!-- Link your stylesheet here if you have one -->
</head>
<body>

    <header>
        <nav>
            <a class="btn" href="{{ site.baseurl }}/pr.html">President's Address</a>
            <a class="btn" href="{{ site.baseurl }}/gsr.html">General Secretary's Report</a>
            <a class="btn" href="{{ site.baseurl }}/tr.html">Treasurer's Report</a>
            <!-- Additional links -->
        </nav>
    </header>

    <main>
        <!-- This is where your Markdown or Page content gets injected -->
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
    </footer>

</body>
</html>
