<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 760px;
            margin: 0 auto;
            padding:1rem;
        }
        h1, h2 {
            text-align: center;
            margin-bottom: 1rem;
        }
        p{
            margin-bottom: 1rem;
        }
        a{
            text-align: center;
            margin-top: 2rem;
            text-decoration: none;
            background-color: #041d38;
            color: #fff;
            border-radius: 5px;
            padding: 0.5rem 1rem;
        }
    </style>
    <!-- Link your stylesheet here if you have one -->
</head>
<body>

    <header>
        <nav>
            <a href="{{ site.baseurl }}/">Home</a>
            <!-- Additional links -->
        </nav>
    </header>

    <main>
        <!-- This is where your Markdown or Page content gets injected -->
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
    </footer>

</body>
</html>
